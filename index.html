<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cumpleaños Ale</title>
    <style>
        body {
            background: linear-gradient(to bottom, #1b3b1e 0%, #2e7d32 50%, #0d2818 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- CANVAS PARA CONFETI --- */
        #canvas-confeti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* --- PANTALLA DE BIENVENIDA --- */
        #pantalla-bienvenida {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 30, 12, 0.96);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding: 20px;
            box-sizing: border-box;
        }

        .btn-sorpresa {
            background: linear-gradient(135deg, #ffeb3b, #f57c00);
            color: #1b5e20;
            font-size: 24px;
            font-weight: bold;
            padding: 18px 40px;
            border: none;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(255, 235, 59, 0.4);
            animation: latido 1.5s infinite;
            cursor: pointer;
            margin-top: 25px;
        }

        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* --- TÍTULO 3D ANIMADO --- */
        .titulo-3d {
            font-size: 2.8rem;
            font-weight: 900;
            color: #ffffff;
            margin: 15px 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 
                0 1px 0 #ccc,
                0 2px 0 #c9c9c9,
                0 3px 0 #bbb,
                0 4px 0 #b9b9b9,
                0 5px 0 #aaa,
                0 6px 1px rgba(0,0,0,.1),
                0 0 5px rgba(0,0,0,.1),
                0 1px 3px rgba(0,0,0,.3),
                0 3px 5px rgba(0,0,0,.2),
                0 5px 10px rgba(0,0,0,.25),
                0 10px 10px rgba(0,0,0,.2),
                0 20px 20px rgba(0,0,0,.15);
            animation: flotar3D 3s ease-in-out infinite alternate;
            z-index: 10;
        }

        @keyframes flotar3D {
            0% { transform: perspective(500px) rotateX(10deg) rotateY(-6deg) translateY(0px); }
            100% { transform: perspective(500px) rotateX(-10deg) rotateY(6deg) translateY(-10px); }
        }

        /* --- BARRA DE CARGA DISCRETA --- */
        #contenedor-carga {
            width: 75%;
            max-width: 320px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin: 10px 0 20px 0;
            z-index: 10;
        }

        #barra-carga {
            width: 0%;
            height: 14px;
            background: linear-gradient(90deg, #ffeb3b, #4caf50);
            border-radius: 15px;
            transition: width 0.3s ease;
        }

        #texto-carga {
            font-size: 13px;
            font-weight: bold;
            margin-top: 4px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* --- CARRUSEL DE FOTOS LIMPIO --- */
        #carrusel {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 480px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        img.foto-carrusel {
            position: absolute;
            border: 6px solid white;
            border-radius: 18px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.7);
            max-width: 100%;
            max-height: 100%;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }

        img.foto-carrusel.activa {
            opacity: 1;
        }

        /* --- ANIMACIÓN DE GLOBOS FLOTANTES --- */
        .globo-flotante {
            position: fixed;
            bottom: -60px;
            font-size: 2.8rem;
            user-select: none;
            pointer-events: none;
            z-index: 6;
            animation: subirGlobo 7s linear forwards;
        }

        @keyframes subirGlobo {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0.2;
            }
        }
    </style>
</head>
<body>

    <!-- CANVAS PARA EL CONFETI -->
    <canvas id="canvas-confeti"></canvas>

    <!-- PANTALLA INICIAL -->
    <div id="pantalla-bienvenida">
        <h1 style="font-size: 2.4rem; color: #ffeb3b; text-shadow: 2px 2px 8px rgba(0,0,0,0.8);">🎉 Tienes una sorpresa 🎉</h1>
        <p style="font-size: 1.2rem; color: #ffffff;">Toca aquí para comenzar</p>
        <button class="btn-sorpresa">🎁 Abrir Sorpresa</button>
    </div>

    <!-- TÍTULO 3D -->
    <h1 class="titulo-3d">¡Feliz Cumpleaños Ale! 🌲✨</h1>

    <!-- BARRA DE CARGA -->
    <div id="contenedor-carga">
        <div id="barra-carga"></div>
        <div id="texto-carga">Cargando recuerdos... 0%</div>
    </div>

    <!-- CARRUSEL LIMPIO -->
    <div id="carrusel"></div>

    <!-- AUDIO -->
    <audio id="reproductor"></audio>

    <script>
        const usuario = 'marce20vazquez-code';
        const repositorio = 'cumplea-os_ale';

        const pantallaBienvenida = document.getElementById('pantalla-bienvenida');
        const reproductor = document.getElementById('reproductor');
        const barraCarga = document.getElementById('barra-carga');
        const textoCarga = document.getElementById('texto-carga');
        const contenedorCarrusel = document.getElementById('carrusel');

        let imagenesPrecargadas = [];
        let cancionInicial = null;
        let cancionesAleatorias = [];
        let primeraCancionSonada = false;
        let indiceFotoActual = 0;
        let intervaloGlobos = null;

        const urlFotos = `https://api.github.com/repos/${usuario}/${repositorio}/contents/fotos`;
        const urlMusica = `https://api.github.com/repos/${usuario}/${repositorio}/contents/musica`;

        // 1. CARGA DE MÚSICA Y PRECARGA DE FOTOS
        Promise.all([
            fetch(urlFotos).then(r => r.json()),
            fetch(urlMusica).then(r => r.json())
        ]).then(([fotos, musica]) => {
            
            musica.forEach(archivo => {
                if (archivo.type === 'file' && archivo.name.match(/\.(mp3|wav|ogg)$/i)) {
                    const nombre = archivo.name.toLowerCase();
                    if (nombre.includes('mananita') || nombre.includes('mañanita')) {
                        cancionInicial = `musica/${archivo.name}`;
                    } else {
                        cancionesAleatorias.push(`musica/${archivo.name}`);
                    }
                }
            });

            const fotosArchivos = fotos.filter(f => f.type === 'file' && f.name.match(/\.(jpg|jpeg|png|gif)$/i));
            let fotosCargadas = 0;
            const totalFotos = fotosArchivos.length;

            if (totalFotos === 0) {
                textoCarga.innerText = "Listo";
                return;
            }

            fotosArchivos.forEach(archivo => {
                const img = new Image();
                img.src = `fotos/${archivo.name}`;
                img.className = 'foto-carrusel';
                img.alt = archivo.name;

                img.onload = () => {
                    fotosCargadas++;
                    const porcentaje = Math.round((fotosCargadas / totalFotos) * 100);
                    barraCarga.style.width = porcentaje + '%';
                    textoCarga.innerText = `Cargando fotos... ${porcentaje}%`;

                    imagenesPrecargadas.push(img);

                    if (fotosCargadas === totalFotos) {
                        textoCarga.innerText = "¡Fotos listas! ✨";
                    }
                };

                img.onerror = () => {
                    fotosCargadas++;
                };
            });

        }).catch(err => console.error('Error al cargar datos:', err));

        // 2. INICIAR SORPRESA (MÚSICA + FIESTA)
        pantallaBienvenida.addEventListener('click', () => {
            pantallaBienvenida.style.display = 'none';
            reproducirSiguiente();
            iniciarAnimacionConfeti();
            iniciarGlobosFlotantes();
        });

        function reproducirSiguiente() {
            if (!primeraCancionSonada && cancionInicial) {
                reproductor.src = cancionInicial;
            } else if (cancionesAleatorias.length > 0) {
                const idx = Math.floor(Math.random() * cancionesAleatorias.length);
                reproductor.src = cancionesAleatorias[idx];
            } else if (cancionInicial) {
                reproductor.src = cancionInicial;
            }

            reproductor.play().catch(e => console.log(e));
        }

        // AL TERMINAR LAS MAÑANITAS -> MOSTRAR FOTOS AUTOMÁTICAMENTE
        reproductor.addEventListener('ended', () => {
            if (!primeraCancionSonada) {
                primeraCancionSonada = true;
                iniciarCarruselFotos();
            }
            reproducirSiguiente();
        });

        // 3. CARRUSEL DE FOTOS
        function iniciarCarruselFotos() {
            if (imagenesPrecargadas.length === 0) return;

            imagenesPrecargadas.forEach(img => contenedorCarrusel.appendChild(img));
            imagenesPrecargadas[0].classList.add('activa');

            setInterval(() => {
                imagenesPrecargadas[indiceFotoActual].classList.remove('activa');
                indiceFotoActual = (indiceFotoActual + 1) % imagenesPrecargadas.length;
                imagenesPrecargadas[indiceFotoActual].classList.add('activa');
            }, 4000);
        }

        // 4. ANIMACIÓN DE GLOBOS Y FIESTA FLOTANTE
        function iniciarGlobosFlotantes() {
            const iconos = ['🎈', '🎁', '🎂', '🥳', '🌟', '💖', '🎉'];
            intervaloGlobos = setInterval(() => {
                const el = document.createElement('div');
                el.className = 'globo-flotante';
                el.innerText = iconos[Math.floor(Math.random() * iconos.length)];
                el.style.left = Math.random() * 90 + 'vw';
                el.style.animationDuration = (Math.random() * 3 + 5) + 's';
                document.body.appendChild(el);

                setTimeout(() => el.remove(), 8000);
            }, 600);
        }

        // 5. SISTEMA DE CONFETI EN CANVAS
        function iniciarAnimacionConfeti() {
            const canvas = document.getElementById('canvas-confeti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particulas = [];
            const colores = ['#ffeb3b', '#e91e63', '#00e676', '#00e5ff', '#ff9100', '#ffffff'];

            for (let i = 0; i < 90; i++) {
                particulas.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 8 + 4,
                    d: Math.random() * 90,
                    color: colores[Math.floor(Math.random() * colores.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleIncremental: Math.random() * 0.07 + 0.05,
                    tiltAngle: 0
                });
            }

            function dibujar() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particulas.forEach((p) => {
                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
                    ctx.stroke();
                });
                actualizar();
                requestAnimationFrame(dibujar);
            }

            function actualizar() {
                particulas.forEach((p) => {
                    p.tiltAngle += p.tiltAngleIncremental;
                    p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
                    p.x += Math.sin(0.5);
                    p.tilt = Math.sin(p.tiltAngle) * 15;

                    if (p.y > canvas.height) {
                        p.x = Math.random() * canvas.width;
                        p.y = -20;
                        p.tilt = Math.floor(Math.random() * 10) - 10;
                    }
                });
            }

            dibujar();
        }

        window.addEventListener('resize', () => {
            const canvas = document.getElementById('canvas-confeti');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
