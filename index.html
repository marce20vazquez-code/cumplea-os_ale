<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cumpleaños Ale</title>
    <style>
        body {
            background: linear-gradient(to bottom, #d4ebd0 0%, #4caf50 40%, #1b5e20 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* --- PANTALLA DE BIENVENIDA (Para activar audio al primer toque) --- */
        #pantalla-bienvenida {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 45, 18, 0.96);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding: 20px;
            box-sizing: border-box;
        }

        .btn-sorpresa {
            background: linear-gradient(135deg, #ffeb3b, #f57c00);
            color: #1b5e20;
            font-size: 22px;
            font-weight: bold;
            padding: 18px 36px;
            border: none;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            animation: latido 1.5s infinite;
            cursor: pointer;
            margin-top: 20px;
        }

        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* --- TÍTULO ANIMADO EN 3D --- */
        .titulo-3d {
            font-size: 2.8rem;
            font-weight: 900;
            color: #ffffff;
            margin: 15px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 
                0 1px 0 #ccc,
                0 2px 0 #c9c9c9,
                0 3px 0 #bbb,
                0 4px 0 #b9b9b9,
                0 5px 0 #aaa,
                0 6px 1px rgba(0,0,0,.1),
                0 0 5px rgba(0,0,0,.1),
                0 1px 3px rgba(0,0,0,.3),
                0 3px 5px rgba(0,0,0,.2),
                0 5px 10px rgba(0,0,0,.25),
                0 10px 10px rgba(0,0,0,.2),
                0 20px 20px rgba(0,0,0,.15);
            animation: flotar3D 3s ease-in-out infinite alternate;
            transform-style: preserve-3d;
        }

        @keyframes flotar3D {
            0% { transform: perspective(500px) rotateX(10deg) rotateY(-8deg) translateY(0px); }
            100% { transform: perspective(500px) rotateX(-10deg) rotateY(8deg) translateY(-12px); }
        }

        /* --- BARRA DE CARGA --- */
        #contenedor-carga {
            width: 80%;
            max-width: 350px;
            background-color: rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin: 15px 0;
        }

        #barra-carga {
            width: 0%;
            height: 18px;
            background: linear-gradient(90deg, #ffeb3b, #4caf50);
            border-radius: 15px;
            transition: width 0.3s ease;
        }

        #texto-carga {
            font-size: 14px;
            font-weight: bold;
            margin-top: 6px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* --- CARRUSEL Y FOTOS --- */
        #carrusel {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 480px;
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img.foto-carrusel {
            position: absolute;
            border: 6px solid white;
            border-radius: 15px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.6);
            max-width: 100%;
            max-height: 100%;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }

        img.foto-carrusel.activa {
            opacity: 1;
            z-index: 1;
        }

        #mensaje-espera {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 15px;
            border: 2px dashed rgba(255, 255, 255, 0.7);
            font-size: 16px;
            line-height: 1.5;
            max-width: 320px;
        }
    </style>
</head>
<body>

    <!-- PANTALLA INICIAL PARA ABRIR LA SORPRESA -->
    <div id="pantalla-bienvenida">
        <h1 style="font-size: 2.2rem; color: #ffeb3b; text-shadow: 2px 2px 5px rgba(0,0,0,0.7);">🎉 Tienes una sorpresa 🎉</h1>
        <p style="font-size: 1.1rem;">Toca la pantalla para comenzar</p>
        <button class="btn-sorpresa">🎁 Abrir Sorpresa</button>
    </div>

    <!-- TÍTULO ANIMADO EN 3D -->
    <h1 class="titulo-3d">¡Feliz Cumpleaños Ale! 🌲✨</h1>

    <!-- BARRA DE CARGA DE FOTOS -->
    <div id="contenedor-carga">
        <div id="barra-carga"></div>
        <div id="texto-carga">Cargando la magia... 0%</div>
    </div>

    <!-- CARRUSEL Y MENSAJE DE ESPERA -->
    <div id="carrusel">
        <div id="mensaje-espera">
            🎶 Escuchando "Las Mañanitas"...<br><br>
            <strong>Las fotos aparecerán automáticamente al terminar la canción.</strong>
        </div>
    </div>

    <!-- REPRODUCTOR DE AUDIO -->
    <audio id="reproductor"></audio>

    <script>
        const usuario = 'marce20vazquez-code';
        const repositorio = 'cumplea-os_ale';

        const pantallaBienvenida = document.getElementById('pantalla-bienvenida');
        const reproductor = document.getElementById('reproductor');
        const barraCarga = document.getElementById('barra-carga');
        const textoCarga = document.getElementById('texto-carga');
        const contenedorCarrusel = document.getElementById('carrusel');
        const mensajeEspera = document.getElementById('mensaje-espera');

        let imagenesPrecargadas = [];
        let cancionInicial = null;
        let cancionesAleatorias = [];
        let primeraCancionSonada = false;
        let indiceFotoActual = 0;
        let fotosCargadasCompletas = false;

        const urlFotos = `https://api.github.com/repos/${usuario}/${repositorio}/contents/fotos`;
        const urlMusica = `https://api.github.com/repos/${usuario}/${repositorio}/contents/musica`;

        // 1. CARGAR INFORMACIÓN DE MÚSICA Y FOTOS
        Promise.all([
            fetch(urlFotos).then(r => r.json()),
            fetch(urlMusica).then(r => r.json())
        ]).then(([fotos, musica]) => {
            
            // Clasificar la música
            musica.forEach(archivo => {
                if (archivo.type === 'file' && archivo.name.match(/\.(mp3|wav|ogg)$/i)) {
                    const nombre = archivo.name.toLowerCase();
                    if (nombre.includes('mananita') || nombre.includes('mañanita')) {
                        cancionInicial = `musica/${archivo.name}`;
                    } else {
                        cancionesAleatorias.push(`musica/${archivo.name}`);
                    }
                }
            });

            // Pre-cargar fotos sin lag
            const fotosArchivos = fotos.filter(f => f.type === 'file' && f.name.match(/\.(jpg|jpeg|png|gif)$/i));
            let fotosCargadas = 0;
            const totalFotos = fotosArchivos.length;

            if (totalFotos === 0) {
                textoCarga.innerText = "No se encontraron fotos.";
                fotosCargadasCompletas = true;
                return;
            }

            fotosArchivos.forEach(archivo => {
                const img = new Image();
                img.src = `fotos/${archivo.name}`;
                img.className = 'foto-carrusel';
                img.alt = archivo.name;

                img.onload = () => {
                    fotosCargadas++;
                    const porcentaje = Math.round((fotosCargadas / totalFotos) * 100);
                    barraCarga.style.width = porcentaje + '%';
                    textoCarga.innerText = `Cargando fotos... ${porcentaje}%`;

                    imagenesPrecargadas.push(img);

                    if (fotosCargadas === totalFotos) {
                        textoCarga.innerText = "¡Fotos listas sin lag! 🚀";
                        fotosCargadasCompletas = true;
                    }
                };

                img.onerror = () => {
                    fotosCargadas++;
                    if (fotosCargadas === totalFotos) fotosCargadasCompletas = true;
                };
            });

        }).catch(err => {
            console.error('Error al cargar datos:', err);
            textoCarga.innerText = "Error cargando archivos.";
        });

        // 2. INICIAR MÚSICA DE INMEDIATO AL TOCAR LA PANTALLA
        function iniciarSorpresa() {
            pantallaBienvenida.style.display = 'none'; // Ocultar pantalla de bienvenida
            reproducirSiguiente(); // Iniciar sonido de inmediato
        }

        pantallaBienvenida.addEventListener('click', iniciarSorpresa);

        function reproducirSiguiente() {
            if (!primeraCancionSonada && cancionInicial) {
                reproductor.src = cancionInicial;
            } else if (cancionesAleatorias.length > 0) {
                const idx = Math.floor(Math.random() * cancionesAleatorias.length);
                reproductor.src = cancionesAleatorias[idx];
            } else if (cancionInicial) {
                reproductor.src = cancionInicial;
            }

            reproductor.play().catch(e => console.log('Error reproduciendo:', e));
        }

        // Al terminar Las Mañanitas -> Activar carrusel de fotos
        reproductor.addEventListener('ended', () => {
            if (!primeraCancionSonada) {
                primeraCancionSonada = true;
                iniciarCarruselFotos();
            }
            reproducirSiguiente();
        });

        // 3. INICIAR CARRUSEL DE FOTOS
        function iniciarCarruselFotos() {
            if (imagenesPrecargadas.length === 0) return;

            mensajeEspera.style.display = 'none';
            imagenesPrecargadas.forEach(img => contenedorCarrusel.appendChild(img));
            imagenesPrecargadas[0].classList.add('activa');

            setInterval(() => {
                imagenesPrecargadas[indiceFotoActual].classList.remove('activa');
                indiceFotoActual = (indiceFotoActual + 1) % imagenesPrecargadas.length;
                imagenesPrecargadas[indiceFotoActual].classList.add('activa');
            }, 4000);
        }
    </script>
</body>
</html>
