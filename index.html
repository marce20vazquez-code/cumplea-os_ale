<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cumpleaños Ale</title>
    <style>
        /* Aquí empieza el código que "crea" el fondo del bosque */
        body {
            /* Degradado de colores: Sol (arriba) a verde oscuro (abajo) */
            background: linear-gradient(to bottom, #d4ebd0 0%, #4caf50 40%, #1b5e20 100%);
            
            /* Ajustes para que ocupe toda la pantalla */
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            
            /* Estilo de las letras para que se vean bien sobre el fondo oscuro */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            
            /* Le agregamos una sombra suave al texto para que resalte más */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        /* Estilo para darle un toque bonito a las fotos que pongas */
        img {
            border: 5px solid white;
            border-radius: 15px; /* Bordes redondeados */
            box-shadow: 0px 4px 8px rgba(0,0,0,0.5); /* Sombra en la foto */
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>¡Feliz Cumpleaños Ale! 🌲✨</h1>
    <p>Aquí están los recuerdos en nuestro bosque mágico creado con código:</p>
    
    <!-- Aquí puedes seguir poniendo tus fotos -->
    <img src="fotos/20250222_103023.jpg" alt="Foto 1" width="400">
    
</body>
</html>
